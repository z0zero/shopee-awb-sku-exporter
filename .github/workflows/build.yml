name: Build extension

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      extension-version: ${{ steps.version.outputs.extension-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Read and validate extension version
        id: version
        shell: bash
        run: |
          version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const manifest = JSON.parse(readFileSync('src/manifest.json', 'utf8')); const packageJson = JSON.parse(readFileSync('package.json', 'utf8')); if (manifest.version !== packageJson.version) { throw new Error('package.json and src/manifest.json versions differ'); } process.stdout.write(manifest.version);")"
          echo "extension-version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Shopee AWB SKU Exporter"
            echo "- Version: `$version`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Prepare esbuild
        run: npm run deps:prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Test packaged build
        run: npm run test:dist

      - name: Verify packaged version
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.extension-version }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
          if (manifest.version !== process.env.EXTENSION_VERSION) {
            throw new Error(`Built manifest version ${manifest.version} does not match ${process.env.EXTENSION_VERSION}`);
          }
          NODE

      - name: Package extension
        shell: bash
        run: |
          cd dist
          zip -r ../shopee-awb-sku-exporter.zip .

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: shopee-awb-sku-exporter.zip
          path: shopee-awb-sku-exporter.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: release-branch-publish
      cancel-in-progress: false

    steps:
      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: shopee-awb-sku-exporter.zip
          path: ${{ runner.temp }}/release-package

      - name: Publish package to Release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: Release
          EXTENSION_VERSION: ${{ needs.build.outputs.extension-version }}
        shell: bash
        run: |
          package_name="shopee-awb-sku-exporter.zip"
          package_path="$RUNNER_TEMP/release-package/$package_name"
          test -f "$package_path"

          package_blob="$(git hash-object "$package_path")"
          current_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$package_name?ref=$RELEASE_BRANCH" --jq '.sha' 2>/dev/null || true)"
          if [[ "$package_blob" == "$current_blob" ]]; then
            echo "Release branch already contains v$EXTENSION_VERSION."
            exit 0
          fi

          head_oid="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha')"
          encoded_package_path="$RUNNER_TEMP/release-package/package.b64"
          base64 -w 0 "$package_path" > "$encoded_package_path"
          headline="build: publish v$EXTENSION_VERSION"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$RELEASE_BRANCH" \
            --arg expected_head_oid "$head_oid" \
            --arg headline "$headline" \
            --arg path "$package_name" \
            --rawfile contents "$encoded_package_path" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repository,
                    branchName: $branch
                  },
                  expectedHeadOid: $expected_head_oid,
                  message: { headline: $headline },
                  fileChanges: {
                    additions: [{ path: $path, contents: $contents }]
                  }
                }
              }
            }' | gh api graphql --input -
